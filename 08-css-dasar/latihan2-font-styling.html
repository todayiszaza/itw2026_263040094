<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>NewJeans Quote</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(61, 61, 61);
      text-align: center;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(100, 100, 100);
      text-shadow: 5px 5px 0 rgb(215, 215, 215);
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: rgb(181, 181, 181);
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151, 151, 151);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>newjeans era</h1>

  <p class="quote">
    "A little bit of <span>nostalgia</span>, <br>
    a little bit of youth and freedom. <br>
    Every melody holds a memory, <br>
    every moment feels like forever."
  </p>

  <p class="credit">— inspired by newjeans</p>

</body>

</html>
