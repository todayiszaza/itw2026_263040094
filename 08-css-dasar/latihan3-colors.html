<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>NewJeans Quote</title>
  <style>
    body {
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: #f8f8ff;
      text-align: center;
      background-color: #0F172A;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: #374460;
      text-shadow: 5px 5px 0 rgb(215 215 215 / 10%);
      color: #38BAF4;
    }

    .quote {
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    span {
      color: crimson;
      text-decoration: line-through;
    }

    .credit {
      font-size: 12px;
      letter-spacing: 2px;
      color: rgb(151 151 151 / 70%);
      font-weight: normal;
    }
  </style>
</head>

<body>

  <h1>newjeans era</h1>

  <p class="quote">
    "Somewhere between <span>yesterday</span> and tomorrow, <br>
    we found a place where time moves slowly. <br>
    Every song becomes a little memory, <br>
    and every moment feels like forever."
  </p>

  <p class="credit">— inspired by newjeans</p>

</body>

</html>
